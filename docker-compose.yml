services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: aerocalc_dfm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d aerocalc_dfm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:adminpassword@postgres:5432/aerocalc_dfm
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set a real secret in .env for anything beyond local dev}
    depends_on:
      postgres:
        condition: service_healthy

  ai-agent:
    build:
      context: .
      dockerfile: core-services/ai-agent/Dockerfile
    ports:
      - "8001:8001"
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_AGENT_DEFAULT_MODEL: ${AI_AGENT_DEFAULT_MODEL:-anthropic/claude-sonnet-4-5}
      AI_AGENT_STRUCTURED_MODEL: ${AI_AGENT_STRUCTURED_MODEL:-anthropic/claude-sonnet-4-5}
    depends_on:
      - api-gateway

  aerocalc-web:
    build:
      context: .
      dockerfile: apps/aerocalc-web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AI_AGENT_URL: http://localhost:8001
    depends_on:
      - api-gateway

  dfm-analyzer-web:
    build:
      context: .
      dockerfile: apps/dfm-analyzer-web/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AI_AGENT_URL: http://localhost:8001
    depends_on:
      - api-gateway
      - ai-agent

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
