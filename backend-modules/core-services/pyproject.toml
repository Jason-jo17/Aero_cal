[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-services"
version = "0.1.0"
description = "Shared DB models, auth, and CRUD used by api-gateway (and optionally other services)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",  # passlib 1.7.x doesn't support bcrypt>=4.1 (removed __about__)
]

[tool.setuptools.packages.find]
include = ["core_services*"]
